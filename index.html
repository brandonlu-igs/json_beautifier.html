<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 美化工具</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .input-section, .output-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .input-textarea {
            background-color: #f8f9fa;
        }

        .output-textarea {
            background-color: #f1f8ff;
            color: #0366d6;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #dc3545;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #28a745;
            display: none;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #4facfe;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 JSON 美化工具</h1>
            <p>貼上任意字串，自動格式化成美觀的 JSON 格式</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <div class="section-title">📝 輸入區域</div>
                <textarea id="inputText" class="input-textarea" placeholder="請在此貼上您的 JSON 字串或任意文字..."></textarea>
                
                <div class="button-group">
                    <button class="btn-primary" onclick="beautifyJSON()">✨ 美化 JSON</button>
                    <button class="btn-secondary" onclick="minifyJSON()">🗜️ 壓縮 JSON</button>
                    <button class="btn-warning" onclick="clearAll()">🗑️ 清空</button>
                </div>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <div class="stats" id="stats" style="display: none;">
                <div class="stat-item">
                    <div class="stat-number" id="charCount">0</div>
                    <div class="stat-label">字符數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="lineCount">0</div>
                    <div class="stat-label">行數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="sizeKB">0</div>
                    <div class="stat-label">大小 (KB)</div>
                </div>
            </div>

            <div class="output-section">
                <div class="section-title">✅ 輸出結果</div>
                <textarea id="outputText" class="output-textarea" readonly placeholder="美化後的 JSON 將顯示在這裡..."></textarea>
                
                <div class="button-group">
                    <button class="btn-success" onclick="copyToClipboard()">📋 複製結果</button>
                    <button class="btn-secondary" onclick="downloadJSON()">💾 下載 JSON</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showMessage(message, type = 'success') {
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            
            // 隱藏所有消息
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            if (type === 'error') {
                errorMsg.textContent = message;
                errorMsg.style.display = 'block';
            } else {
                successMsg.textContent = message;
                successMsg.style.display = 'block';
            }
            
            // 3秒後自動隱藏消息
            setTimeout(() => {
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';
            }, 3000);
        }

        function updateStats(text) {
            const stats = document.getElementById('stats');
            const charCount = document.getElementById('charCount');
            const lineCount = document.getElementById('lineCount');
            const sizeKB = document.getElementById('sizeKB');
            
            if (text.trim()) {
                stats.style.display = 'flex';
                charCount.textContent = text.length;
                lineCount.textContent = text.split('\n').length;
                sizeKB.textContent = (new Blob([text]).size / 1024).toFixed(2);
            } else {
                stats.style.display = 'none';
            }
        }

        function beautifyJSON() {
            const input = document.getElementById('inputText').value.trim();
            const output = document.getElementById('outputText');
            
            if (!input) {
                showMessage('請輸入要美化的 JSON 字串', 'error');
                return;
            }
            
            try {
                // 嘗試解析 JSON
                const parsed = JSON.parse(input);
                // 美化輸出，使用 4 個空格縮進
                const beautified = JSON.stringify(parsed, null, 4);
                output.value = beautified;
                updateStats(beautified);
                showMessage('JSON 美化成功！');
            } catch (error) {
                // 如果不是有效的 JSON，嘗試修復常見問題
                let fixedInput = input;
                
                // 修復常見的 JSON 格式問題
                fixedInput = fixedInput
                    .replace(/'/g, '"')  // 單引號改雙引號
                    .replace(/([{,]\s*)([a-zA-Z_$][a-zA-Z0-9_$]*)\s*:/g, '$1"$2":')  // 為屬性名加引號
                    .replace(/:\s*([a-zA-Z_$][a-zA-Z0-9_$]*)\s*([,}])/g, ': "$1"$2')  // 為字串值加引號
                    .replace(/,(\s*[}\]])/g, '$1');  // 移除多餘的逗號
                
                try {
                    const parsed = JSON.parse(fixedInput);
                    const beautified = JSON.stringify(parsed, null, 4);
                    output.value = beautified;
                    updateStats(beautified);
                    showMessage('JSON 已自動修復並美化成功！');
                } catch (secondError) {
                    showMessage(`JSON 格式錯誤: ${error.message}`, 'error');
                    output.value = '';
                    updateStats('');
                }
            }
        }

        function minifyJSON() {
            const input = document.getElementById('inputText').value.trim();
            const output = document.getElementById('outputText');
            
            if (!input) {
                showMessage('請輸入要壓縮的 JSON 字串', 'error');
                return;
            }
            
            try {
                const parsed = JSON.parse(input);
                const minified = JSON.stringify(parsed);
                output.value = minified;
                updateStats(minified);
                showMessage('JSON 壓縮成功！');
            } catch (error) {
                showMessage(`JSON 格式錯誤: ${error.message}`, 'error');
            }
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            updateStats('');
            showMessage('已清空所有內容');
        }

        async function copyToClipboard() {
            const output = document.getElementById('outputText').value;
            
            if (!output) {
                showMessage('沒有可複製的內容', 'error');
                return;
            }
            
            try {
                await navigator.clipboard.writeText(output);
                showMessage('已複製到剪貼板！');
            } catch (error) {
                // 備用方案
                const textArea = document.createElement('textarea');
                textArea.value = output;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showMessage('已複製到剪貼板！');
            }
        }

        function downloadJSON() {
            const output = document.getElementById('outputText').value;
            
            if (!output) {
                showMessage('沒有可下載的內容', 'error');
                return;
            }
            
            const blob = new Blob([output], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `beautified-json-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showMessage('JSON 文件已下載！');
        }

        // 自動美化功能（當用戶停止輸入 1 秒後）
        let autoBeautifyTimeout;
        document.getElementById('inputText').addEventListener('input', function() {
            clearTimeout(autoBeautifyTimeout);
            autoBeautifyTimeout = setTimeout(() => {
                const input = this.value.trim();
                if (input && input.length > 10) {
                    // 只有當輸入看起來像 JSON 時才自動美化
                    if ((input.startsWith('{') && input.endsWith('}')) || 
                        (input.startsWith('[') && input.endsWith(']'))) {
                        beautifyJSON();
                    }
                }
            }, 1000);
        });

        // 支援拖放文件
        const inputArea = document.getElementById('inputText');
        
        inputArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.backgroundColor = '#e3f2fd';
        });
        
        inputArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.backgroundColor = '#f8f9fa';
        });
        
        inputArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.backgroundColor = '#f8f9fa';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type === 'application/json' || file.name.endsWith('.json')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        inputArea.value = e.target.result;
                        beautifyJSON();
                    };
                    reader.readAsText(file);
                } else {
                    showMessage('請拖放 JSON 文件', 'error');
                }
            }
        });

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 'Enter':
                        e.preventDefault();
                        beautifyJSON();
                        break;
                    case 'k':
                        e.preventDefault();
                        clearAll();
                        break;
                }
            }
        });
    </script>
</body>
</html>
